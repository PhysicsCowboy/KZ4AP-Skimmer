name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # Fixed check names, independent of the runner image: the main ruleset requires
    # "build-and-test (windows)" and "build-and-test (linux)".
    name: build-and-test (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows
          - os: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (owner, 2026-10-02)
            preset: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Python dependencies
        run: python -m pip install -r training/requirements.txt

      - name: Python tests
        run: python -m pytest training -q

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: C++ tests
        run: ctest --preset ${{ matrix.preset }}

      - name: Benchmark smoke test
        shell: bash
        run: bash bench/smoke.sh build/${{ matrix.preset }}
